<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TrueMenu video stage</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ground:#F6F5F0;--ink:#192736;--muted:#4A5462;--line:#D9DCD6;--green:#1E7A4C;--red:#B42318;--amber:#9A5B00}
*{box-sizing:border-box}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:var(--ground);color:var(--ink);font-family:Inter,Arial,sans-serif}
.g{font-family:"Space Grotesk",Arial,sans-serif;letter-spacing:-.02em}
#demo{position:absolute;inset:0;display:grid;grid-template-columns:620px 1fr;gap:90px;padding:70px 120px 70px 150px;align-items:center}
.phone{width:470px;height:940px;border-radius:64px;background:#111;padding:16px;box-shadow:0 30px 60px rgba(25,39,54,.25);justify-self:center}
.phone iframe{width:438px;height:908px;border:0;border-radius:50px;background:var(--ground)}
.kicker{font:600 26px Inter,Arial,sans-serif;color:var(--green);text-transform:uppercase;letter-spacing:.08em;margin-bottom:22px}
.title{font-size:64px;line-height:1.08;font-weight:700;margin:0 0 28px;max-width:1000px;text-wrap:balance}
.body{font-size:32px;line-height:1.4;color:var(--muted);max-width:940px;margin:0 0 36px}
.panel{background:#fff;border:2px solid var(--line);border-radius:22px;padding:26px 30px;max-width:900px}
.panel h3{margin:0 0 14px;font:700 24px "Space Grotesk",Arial,sans-serif;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.feed{display:flex;align-items:center;gap:18px;padding:12px 0;border-bottom:1px solid var(--line);font-size:28px}
.feed:last-child{border-bottom:0}
.feed .n{flex:1;font-weight:600}.feed .age{color:var(--muted);font-variant-numeric:tabular-nums}
.pill{font:700 20px "Space Grotesk",Arial,sans-serif;letter-spacing:.06em;color:#fff;border-radius:999px;padding:8px 16px;min-width:110px;text-align:center}
.fresh{background:var(--green)}.aging{background:var(--amber)}.stale{background:var(--red)}
.ev{font-size:27px;padding:10px 0;border-bottom:1px solid var(--line)}.ev:last-child{border-bottom:0}
.ev.red{color:var(--red);font-weight:600}.ev.green{color:var(--green);font-weight:600}
#card{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;padding:0 200px}
.big{font-size:118px;line-height:1.02;font-weight:700;margin:0 0 36px;text-wrap:balance}
.sub{font-size:40px;line-height:1.35;color:var(--muted);max-width:1300px;margin:0}
.mark{display:flex;align-items:center;gap:22px;margin-bottom:56px}
.mark span{font:700 54px "Space Grotesk",Arial,sans-serif}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:80px;margin-top:20px;max-width:1500px}
.stat .n{font:700 150px/1 "Space Grotesk",Arial,sans-serif;letter-spacing:-.04em}
.stat .l{font-size:36px;line-height:1.3;color:var(--muted);margin-top:16px}
.foot{position:absolute;left:200px;bottom:70px;font-size:26px;color:var(--muted)}
</style>
</head>
<body>
<section id="demo">
  <div class="phone"><iframe id="app" src="http://localhost:8099/demo" title="TrueMenu booth demo on a phone"></iframe></div>
  <div>
    <div class="kicker" id="kicker"></div>
    <h1 class="title g" id="title"></h1>
    <p class="body" id="body"></p>
    <div id="panel"></div>
  </div>
</section>
<section id="card"></section>
<script>
const MARK = '<svg width="76" height="76" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="#1E7A4C"/><path d="M29 51 L44 66 L72 36" fill="none" stroke="#F6F5F0" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function demo(k, t, b, panel) {
  document.getElementById('demo').style.display = 'grid';
  document.getElementById('card').style.display = 'none';
  kicker.textContent = k; title.textContent = t; body.textContent = b;
  document.getElementById('panel').innerHTML = panel || '';
}
function card(html) {
  document.getElementById('demo').style.display = 'none';
  const c = document.getElementById('card'); c.style.display = 'flex'; c.innerHTML = html;
}
function feeds(merchants) {
  return '<div class="panel"><h3>Restaurant feeds, live</h3>' + merchants.map(m =>
    `<div class="feed"><span class="n">${m.name}</span><span class="age">${m.age}s</span><span class="pill ${m.label}">${m.label.toUpperCase()}</span></div>`).join('') + '</div>';
}
function log(items) {
  return '<div class="panel"><h3>What just happened</h3>' + items.map(([cls, t]) => `<div class="ev ${cls}">${t}</div>`).join('') + '</div>';
}
window.MARK = MARK;
</script>
</body>
</html>
